[package]
name = "bagdock"
version = "0.1.0"
edition = "2021"
description = "Official Bagdock API client for Rust"
license = "MIT"
homepage = "https://docs.bagdock.com/sdks/rust"
repository = "https://github.com/bagdock/bagdock-rust"
keywords = ["bagdock", "sdk", "api", "self-storage"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
